<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values.
         Without it the insets are always 0 and the installed app cannot pad itself
         clear of the notch and the home indicator. See #root in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ADVO Technologies | Web and App Development in the Philippines</title>
    <meta
      name="description"
      content="ADVO Technologies builds websites, apps, and business systems for Philippine companies, from school ID gates to automated car parks. Get a quote in 24 hours."
    />
    <meta name="author" content="ADVO Technologies" />

    <!-- Prevent FOUC -->
    <style>
      html {
        visibility: hidden;
      }
      html.loaded {
        visibility: visible;
      }
      /* The prerendered copy of the page is for crawlers that do not run JavaScript.
         With JavaScript on, React replaces it on mount; hide it until then. */
      html.loaded [data-prerender] {
        display: none;
      }
    </style>
    <script>
      document.documentElement.classList.add("loaded");
    </script>

    <!-- Preload fonts to prevent layout shift -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon + installable PWA. Bump ?v= when the icon changes: browsers keep a
         favicon cached by URL long after the file itself is replaced. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ADVO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Lets Google show the share image large in Search and Discover. -->
    <meta name="robots" content="max-image-preview:large" />

    <!-- Open Graph. Messenger, Viber and Facebook read these. The image URL must be
         absolute: link scrapers do not resolve a relative path. Rename the image file
         when it changes, since Facebook caches the preview by image URL. -->
    <meta property="og:site_name" content="ADVO Technologies" />
    <meta property="og:title" content="ADVO Technologies | Web and App Development in the Philippines" />
    <meta
      property="og:description"
      content="ADVO Technologies builds websites, apps, and business systems for Philippine companies, from school ID gates to automated car parks. Get a quote in 24 hours."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:url" content="https://advo.ph/" />
    <meta property="og:image" content="https://advo.ph/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://advo.ph/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ADVO Technologies" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@advo_ph" />
    <meta name="twitter:title" content="ADVO Technologies | Web and App Development in the Philippines" />
    <meta
      name="twitter:description"
      content="ADVO Technologies builds websites, apps, and business systems for Philippine companies, from school ID gates to automated car parks. Get a quote in 24 hours."
    />
    <meta name="twitter:image" content="https://advo.ph/og-image.jpg" />
    <meta name="twitter:image:alt" content="ADVO Technologies" />

    <!-- The values above are the home page's. scripts/prerender.mjs rewrites them per
         page at build time and adds the canonical link and the JSON-LD (from
         src/seo/site.ts). In the browser, src/seo/RouteSeo.tsx keeps them in step. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
