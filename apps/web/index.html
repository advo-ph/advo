<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADVO. Build together. Ship with clarity.</title>
    <meta
      name="description"
      content="ADVO helps teams plan, build, and deliver digital products inside one connected workspace."
    />
    <meta name="author" content="ADVO" />

    <!-- Prevent FOUC -->
    <style>
      html {
        visibility: hidden;
      }
      html.loaded {
        visibility: visible;
      }
    </style>
    <script>
      document.documentElement.classList.add("loaded");
    </script>

    <!-- Preload fonts to prevent layout shift -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon + installable PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ADVO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="ADVO. Build together. Ship with clarity." />
    <meta
      property="og:description"
      content="ADVO helps teams plan, build, and deliver digital products inside one connected workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://advo.ph" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@advo_ph" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
