# /etc/nginx/sites-available/advo-api
# ln -s /etc/nginx/sites-available/advo-api /etc/nginx/sites-enabled/

upstream advo_api {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name api.advo.ph;

    # Redirect to HTTPS (uncomment after certbot)
    # return 301 https://$server_name$request_uri;

    # API proxy
    location /api/ {
        proxy_pass http://advo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # Static file uploads
    location /uploads/ {
        alias /var/www/advo/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health check (no rate limit)
    location = /api/health {
        proxy_pass http://advo_api;
    }
}

# Rate limit zone (add to /etc/nginx/nginx.conf http block)
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
