name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same branch when a new commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Production API target — same as VPS-side build
          VITE_API_URL: https://api.advo.ph

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Don't fail the run on advisories — surface them as a warning
      # so we see them but a single moderate dep doesn't block deploys.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
